<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-label="Local neighbourhood block plan">
  <rect width="800" height="540" fill="#0B111E"/>

  <!-- Subtle architectural parcel blocks -->
  <g fill="#111A2C" stroke="#1E293B" stroke-width="2">
    <!-- Top row parcels (Row A) -->
    <rect x="24" y="22" width="166" height="136" rx="4"/>
    <rect x="218" y="22" width="166" height="136" rx="4"/>
    <rect x="416" y="22" width="166" height="136" rx="4"/>
    <rect x="610" y="22" width="166" height="136" rx="4"/>

    <!-- Middle row parcels (Row B) -->
    <rect x="24" y="198" width="166" height="144" rx="4"/>
    <rect x="218" y="198" width="166" height="144" rx="4" fill="#132036"/>
    <rect x="416" y="198" width="166" height="144" rx="4"/>
    <rect x="610" y="198" width="166" height="144" rx="4"/>

    <!-- Bottom row parcels (Row C) -->
    <rect x="24" y="382" width="166" height="136" rx="4"/>
    <rect x="218" y="382" width="166" height="136" rx="4"/>
    <rect x="416" y="382" width="166" height="136" rx="4"/>
    <rect x="610" y="382" width="166" height="136" rx="4"/>
  </g>

  <!-- Building footprints inside parcels -->
  <g fill="#162238" stroke="#24324A" stroke-width="1.5">
    <rect x="44" y="42" width="126" height="44"/>
    <rect x="44" y="102" width="76" height="36"/>
    <rect x="238" y="40" width="126" height="96"/>
    <rect x="438" y="40" width="120" height="52"/>
    <rect x="470" y="104" width="88" height="36"/>
    <rect x="630" y="42" width="126" height="92"/>

    <rect x="42" y="218" width="128" height="104"/>
    <!-- Courtyard footprint in B2 -->
    <path d="M238 216 H364 V322 H238 Z M268 244 V294 H334 V244 Z" fill-rule="evenodd"/>
    <rect x="436" y="218" width="124" height="104"/>
    <rect x="632" y="218" width="122" height="48"/>
    <rect x="632" y="278" width="122" height="46"/>

    <rect x="44" y="402" width="124" height="94"/>
    <rect x="238" y="402" width="126" height="46"/>
    <rect x="238" y="458" width="96" height="40"/>
    <rect x="436" y="402" width="126" height="94"/>
    <rect x="630" y="402" width="126" height="94"/>
  </g>

  <!-- Primary arterial & residential streets -->
  <g stroke="#293952" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.85">
    <line x1="0" y1="178" x2="800" y2="178"/>
    <line x1="0" y1="362" x2="800" y2="362"/>
    <line x1="204" y1="0" x2="204" y2="540"/>
    <line x1="400" y1="0" x2="400" y2="540"/>
    <line x1="596" y1="0" x2="596" y2="540"/>
  </g>

  <!-- Subtle street labels (static local vector text) -->
  <g fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">
    <text x="28" y="173">NORTH ARTERIAL RD</text>
    <text x="28" y="357">COURTYARD LANE</text>
    <text x="410" y="16">EAST AVE</text>
  </g>
</svg>
