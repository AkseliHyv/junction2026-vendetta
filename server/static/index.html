<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Noise map</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.1/dist/maplibre-gl.css" integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous" />
    <link rel="stylesheet" href="src/styles.css" />
    <script>
      // Backend base URL. '/api' = the server/server.py that serves this page.
      // null (or open the page with ?demo) = built-in demo feed; ?api=… overrides.
      // mapStyle: any MapLibre style URL (default: OpenFreeMap dark, no key needed).
      window.NM_CONFIG = { apiBase: '/api' };
    </script>
  </head>
  <body>
    <main class="app">
      <div id="map" class="map" role="region" aria-label="Noise map. Tap a street or sensor for details."></div>

      <header class="top">
        <form class="search" role="search" autocomplete="off">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5 20 20" /></svg>
          <input id="search" type="search" placeholder="Search" aria-label="Search a place" aria-controls="results" />
        </form>
        <ul id="results" class="results" role="listbox" hidden></ul>
        <div id="status" class="status" data-state="loading" role="status">
          <i class="status-dot"></i><span class="status-text">Loading measurements…</span>
        </div>
      </header>

      <div class="legend" aria-label="Colour scale from 40 to 80 decibels">
        <span>40</span><i class="legend-bar"></i><span class="legend-max">80<br />dB</span>
      </div>

      <button id="locate" class="locate" type="button" aria-label="Show my location">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.2" /><circle cx="12" cy="12" r="2.2" class="fill" /><path d="M12 2.5v3.3M12 18.2v3.3M2.5 12h3.3M18.2 12h3.3" /></svg>
      </button>

      <section id="sheet" class="sheet" aria-hidden="true" hidden aria-labelledby="sheet-title">
        <div class="sheet-grab">
          <div class="sheet-handle"></div>
          <div class="sheet-head">
            <h2 id="sheet-title" class="sheet-title"></h2>
            <button class="sheet-close" type="button" aria-label="Close">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
            </button>
          </div>
        </div>
        <div class="sheet-main">
          <div class="reading"><span class="reading-value"></span><span class="reading-unit">dB</span></div>
          <div class="category">
            <div class="category-row"><i class="category-dot"></i><span class="category-label"></span></div>
            <div class="category-desc"></div>
          </div>
        </div>
        <div class="chart" aria-label="Hourly levels over the last 24 hours">
          <div class="bars"></div>
          <div class="now-track"><i class="now-dot"></i></div>
          <div class="axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
        </div>
        <div class="sheet-details" hidden></div>
        <p class="sheet-meta" hidden></p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.1/dist/maplibre-gl.js" integrity="sha384-nXMl9YiLoSG5KBPTFgvxVuIqQQcqIvo0bFrvoEaGJC6r7IibIzF1S36Zbf/sKBtL" crossorigin="anonymous"></script>
    <script src="src/config.js"></script>
    <script src="src/util.js"></script>
    <script src="src/osm-roads.js"></script>
    <script src="src/data.js"></script>
    <script src="src/field.js"></script>
    <script src="src/store.js"></script>
    <script src="src/mock.js"></script>
    <script src="src/api.js"></script>
    <script src="src/map.js"></script>
    <script src="src/sheet.js"></script>
    <script src="src/search.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
